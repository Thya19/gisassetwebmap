<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIS Asset Viewer</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Marker clustering: nearby assets collapse into one numbered circle -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Leaflet pin icons (Font Awesome glyphs inside classic Leaflet pins) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.css">
<script src="https://unpkg.com/leaflet.awesome-markers@2.0.5/dist/leaflet.awesome-markers.js"></script>

<style>
html, body { height:100%; margin:0; font-family: Arial, sans-serif; }
#map { height:100%; }

/* Info panel */
.panel {
    position:absolute; top:10px; left:55px; z-index:1000;
    background:#fff; padding:12px 14px; border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.25); min-width:200px; max-width:260px;
}
.panel h3 { margin:0 0 6px; font-size:16px; }
.panel .meta { font-size:13px; color:#444; line-height:1.5; }
.panel button {
    margin-top:8px; width:100%; padding:7px; border:none; border-radius:5px;
    background:#0078d4; color:#fff; cursor:pointer; font-size:13px;
}
.panel button:hover { background:#005a9e; }
.panel .err { color:#c00; font-size:13px; }

/* Collapsible legend / asset list */
.legend {
    background:#fff; border-radius:8px; width:240px;
    box-shadow:0 2px 10px rgba(0,0,0,.25); font-size:13px;
}
.legend-title {
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; font-weight:bold; font-size:14px; cursor:pointer; user-select:none;
}
.legend-body { max-height:45vh; overflow-y:auto; padding:0 12px 8px; }
.legend.collapsed .legend-body { display:none; }
.legend .row { display:flex; align-items:center; gap:6px; padding:4px 0; }
.legend .row label { display:flex; align-items:center; gap:6px; flex:1; cursor:pointer; }
.legend .swatch {
    width:14px; height:14px; border-radius:50%; flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.35);
}
.legend .count { color:#666; }
.legend .chev {
    border:none; background:none; cursor:pointer; font-size:12px;
    width:18px; padding:0; color:#444;
}
.legend .items { display:none; margin:0 0 6px 24px; border-left:2px solid #e3e3e3; padding-left:8px; }
.legend .items.open { display:block; }
.legend .items a {
    display:block; padding:2px 0; color:#0b5cad; text-decoration:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.legend .items a:hover { text-decoration:underline; }

/* Cluster bubbles (one colour per category) */
.cluster {
    width:40px; height:40px; border-radius:50%; border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.55), 0 1px 6px rgba(0,0,0,.45);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:bold; font-size:14px; box-sizing:border-box;
}
.leaflet-popup-content b { font-size:14px; }
</style>
</head>

<body>

<div class="panel">
    <h3>GIS Asset Viewer</h3>
    <div class="meta" id="summary">Loading...</div>
    <button id="zoomBtn" type="button" hidden>Zoom to features</button>
</div>

<div id="map"></div>

<script>
// ---------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------
const GEOSERVER = "https://viscous-fiftieth-sip.ngrok-free.dev/geoserver";
const WORKSPACE = "thyagisautomation";

// Matched against the "category" column (case-insensitive, partial match).
// marker = Awesome-Markers pin colour, icon = Font Awesome 4.7 icon name.
const CATEGORY_STYLES = {
    school:   { marker: "blue",  icon: "graduation-cap", label: "Schools"   },
    hospital: { marker: "red",   icon: "hospital-o",     label: "Hospitals" },
    hotel:    { marker: "green", icon: "bed",            label: "Hotels"    }
};
// Used for any category not listed above
const FALLBACK_MARKERS = ["orange", "purple", "cadetblue", "darkgreen"];

// Hex colours that match the pin colours (for legend dots and cluster bubbles)
const MARKER_HEX = {
    blue: "#2a81cb", red: "#cb2b3e", green: "#2aad27", orange: "#cb8427",
    purple: "#9c2bcb", cadetblue: "#436978", darkgreen: "#728224", darkred: "#a23336"
};

// ---------------------------------------------------------------
// MAP + BASEMAPS
// ---------------------------------------------------------------
const map = L.map("map").setView([11.947, 79.487], 13);

// const positron = L.tileLayer(
//     "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
//     { maxZoom: 20, subdomains: "abcd",
//       attribution: "&copy; OpenStreetMap contributors &copy; CARTO" }
// ).addTo(map);

const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);

const imagery = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 19, attribution: "Tiles &copy; Esri" });

L.control.layers({ "Street": osm, "Satellite": imagery }, null,
                 { position: "topright" }).addTo(map);
L.control.scale({ imperial: false }).addTo(map);

// ---------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------
const summaryEl = document.getElementById("summary");
const zoomBtn   = document.getElementById("zoomBtn");

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

// WFS request -> GeoJSON. The filter runs on GeoServer.
async function getWfs(layerName, cqlFilter) {
    const params = new URLSearchParams({
        service: "WFS", version: "1.0.0", request: "GetFeature",
        typeName: WORKSPACE + ":" + layerName,
        outputFormat: "application/json",
        srsName: "EPSG:4326",
        CQL_FILTER: cqlFilter
    });
    
    const response = await fetch(GEOSERVER + "/" + WORKSPACE + "/ows?" + params, {
    headers: { "ngrok-skip-browser-warning": "true" }
});
    if (!response.ok) throw new Error(layerName + " returned HTTP " + response.status);
    return response.json();
}

const dynamicStyles = {};
function styleForCategory(category) {
    const name = String(category || "Other").toLowerCase();
    let style = null;
    for (const key in CATEGORY_STYLES) {
        if (name.includes(key)) { style = CATEGORY_STYLES[key]; break; }
    }
    if (!style) {
        if (!dynamicStyles[name]) {
            const marker = FALLBACK_MARKERS[Object.keys(dynamicStyles).length % FALLBACK_MARKERS.length];
            dynamicStyles[name] = { marker, icon: "map-marker", label: category || "Other" };
        }
        style = dynamicStyles[name];
    }
    return { ...style, hex: MARKER_HEX[style.marker] };
}

function pinIcon(style) {
    return L.AwesomeMarkers.icon({
        icon: style.icon, prefix: "fa", markerColor: style.marker, iconColor: "white"
    });
}

function clusterIconFor(style) {
    return function (cluster) {
        return L.divIcon({
            className: "",
            html: '<div class="cluster" style="background:' + style.hex + '">' +
                  cluster.getChildCount() + "</div>",
            iconSize: [40, 40]
        });
    };
}

// ---------------------------------------------------------------
// MAIN
// ---------------------------------------------------------------
const bufferLayer   = L.featureGroup().addTo(map);
const locationLayer = L.featureGroup().addTo(map);
const categoryData  = {};   // label -> { style, cluster, markers }

function zoomToFeatures() {
    const bounds = L.latLngBounds([]);
    [bufferLayer, locationLayer, ...Object.values(categoryData).map(c => c.cluster)]
        .forEach(layer => {
            const b = layer.getBounds();
            if (b.isValid()) bounds.extend(b);
        });
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });
}
zoomBtn.addEventListener("click", zoomToFeatures);

async function main() {
    const token = Number(new URLSearchParams(location.search).get("token"));
    if (!Number.isInteger(token) || token <= 0) {
        summaryEl.innerHTML = '<div class="err">No valid request ID in the link.</div>';
        return;
    }

    let buffer, searchLoc, assets;
    try {
        [buffer, searchLoc, assets] = await Promise.all([
            getWfs("v_search_buffer",   "token=" + token),
            getWfs("v_search_location", "token=" + token),
            getWfs("poi_assets",        "token=" + token)
        ]);
    } catch (err) {
        console.error(err);
        summaryEl.innerHTML =
            '<div class="err">Could not load map data.<br>' + escapeHtml(err.message) +
            "<br>Check that GeoServer is running and CORS is enabled.</div>";
        return;
    }

    // 1. Search buffer
    L.geoJSON(buffer, {
        style: { color: "#0F1CD9", weight: 2, dashArray: "6 4",
                 fillColor: "#8387F7", fillOpacity: 0.20 }
    }).eachLayer(l => bufferLayer.addLayer(l));

    // 2. Search location (black star pin)
    L.geoJSON(searchLoc, {
        pointToLayer: (f, latlng) => L.marker(latlng, {
            zIndexOffset: 1000,
            icon: L.AwesomeMarkers.icon({
                icon: "star", prefix: "fa", markerColor: "black", iconColor: "white"
            })
        }),
        onEachFeature: (f, layer) => layer.bindPopup("<b>Search location</b>")
    }).eachLayer(l => locationLayer.addLayer(l));

    // 3. Assets: one clustered layer per category
    const grouped = {};
    (assets.features || []).forEach(f => {
        const style = styleForCategory(f.properties && f.properties.category);
        (grouped[style.label] = grouped[style.label] || { style, features: [] }).features.push(f);
    });

    Object.keys(grouped).sort().forEach(label => {
        const { style, features } = grouped[label];

        const cluster = L.markerClusterGroup({
            iconCreateFunction: clusterIconFor(style),
            maxClusterRadius: 45,
            showCoverageOnHover: false,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 18
        });

        const markers = L.geoJSON(features, {
            pointToLayer: (f, latlng) => L.marker(latlng, { icon: pinIcon(style) }),
            onEachFeature: (f, layer) => {
                const p = f.properties || {};
                layer.bindPopup(
                    "<b>" + escapeHtml(p.name || "Unnamed") + "</b><br>" +
                    '<span style="color:' + style.hex + '">&#9679;</span> ' +
                    escapeHtml(p.category || "Other")
                );
            }
        }).getLayers();

        markers.sort((a, b) =>
            String(a.feature.properties.name || "").localeCompare(String(b.feature.properties.name || "")));

        cluster.addLayers(markers);
        cluster.addTo(map);
        categoryData[label] = { style, cluster, markers };
    });

    const total = (assets.features || []).length;
    summaryEl.innerHTML = "Request ID: " + token + "<br>Assets found: " + total;
    zoomBtn.hidden = false;

    buildLegend(total);
    zoomToFeatures();
}

// ---------------------------------------------------------------
// COLLAPSIBLE LEGEND + ASSET LIST
// ---------------------------------------------------------------
function buildLegend(total) {
    const legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
        const div = L.DomUtil.create("div", "legend");
        let html = '<div class="legend-title" data-toggle="legend">' +
                   "<span>Assets (" + total + ')</span><span class="arrow">&#9662;</span></div>' +
                   '<div class="legend-body">';

        const labels = Object.keys(categoryData);
        labels.forEach(label => {
            const { style, markers } = categoryData[label];
            html += '<div class="row">' +
                    '<button class="chev" type="button" data-toggle="items" title="Show list">&#9656;</button>' +
                    '<label><input type="checkbox" checked data-cat="' + escapeHtml(label) + '">' +
                    '<span class="swatch" style="background:' + style.hex + '"></span>' +
                    escapeHtml(label) + "</label>" +
                    '<span class="count">' + markers.length + "</span></div>" +
                    '<div class="items">';
            markers.forEach((m, i) => {
                html += '<a href="#" data-cat="' + escapeHtml(label) + '" data-i="' + i + '">' +
                        escapeHtml(m.feature.properties.name || "Unnamed") + "</a>";
            });
            html += "</div>";
        });
        if (!labels.length) html += "No assets found";
        html += "</div>";

        div.innerHTML = html;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);

        div.addEventListener("click", e => {
            // Collapse / expand the whole legend
            if (e.target.closest('[data-toggle="legend"]')) {
                div.classList.toggle("collapsed");
                div.querySelector(".arrow").innerHTML = div.classList.contains("collapsed") ? "&#9656;" : "&#9662;";
                return;
            }
            // Collapse / expand one category's list
            const chev = e.target.closest('[data-toggle="items"]');
            if (chev) {
                const items = chev.closest(".row").nextElementSibling;
                items.classList.toggle("open");
                chev.innerHTML = items.classList.contains("open") ? "&#9662;" : "&#9656;";
                return;
            }
            // Click an asset name: zoom to it and open its popup
            const link = e.target.closest("a[data-i]");
            if (link) {
                e.preventDefault();
                const entry = categoryData[link.dataset.cat];
                const marker = entry.markers[Number(link.dataset.i)];
                if (!map.hasLayer(entry.cluster)) map.addLayer(entry.cluster);
                entry.cluster.zoomToShowLayer(marker, () => marker.openPopup());
            }
        });

        // Show / hide a whole category
        div.addEventListener("change", e => {
            const entry = categoryData[e.target.dataset.cat];
            if (!entry) return;
            e.target.checked ? map.addLayer(entry.cluster) : map.removeLayer(entry.cluster);
        });

        return div;
    };

    legend.addTo(map);
}

main();
</script>
</body>
</html>
