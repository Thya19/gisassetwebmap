<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIS User Asset Search</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:40px 16px;
}
.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h2{ text-align:center; }
label{ font-weight:bold; }
input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#0078d4;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover:not(:disabled){ background:#005a9e; }
button:disabled{ background:#8ab8dc; cursor:not-allowed; }
#result{ margin-top:20px; padding:10px; }
.success{ color:green; }
.error{ color:#c00; }
</style>
</head>

<body>
<div class="container">
<h2>GIS Asset Search</h2>

<form id="searchForm">
    <label for="username">Name</label>
    <input type="text" id="username" placeholder="Your Name" required>

    <label for="address">Address</label>
    <input type="text" id="address" placeholder="Eg. Any City or Town name, not in short" required>

    <label for="radius">Buffer Radius (KM)</label>
    <input type="number" id="radius" placeholder="Any value between 0.1 to 50" min="0.1" max="50" step="any" oninput="if(this.value > 50) this.value = 50; if(this.value < 0 && this.value !== '') this.value = 0.1;" required>

    <button type="submit" id="submitBtn">Generate Map</button>
</form>

<div id="result" aria-live="polite"></div>
</div>

<script>
// Production URL of the n8n Webhook node (path must be generate-map, method POST).
// Do NOT use /webhook-test/ here: it only works while you click "Execute" in the editor.
const WEBHOOK_URL = "https://viscous-fiftieth-sip.ngrok-free.dev/webhook/generate-map";

const form   = document.getElementById("searchForm");
const result = document.getElementById("result");
const btn    = document.getElementById("submitBtn");

function showError(message){
    result.innerHTML = "";
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "Error: " + message;
    result.appendChild(div);
}

form.addEventListener("submit", async function(e){
    e.preventDefault();

    btn.disabled = true;
    result.textContent = "Generating map... this can take up to a minute.";

    try{
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                address:  document.getElementById("address").value.trim(),
                radius:   Number(document.getElementById("radius").value)
            })
        });

        const text = await response.text();

        if(!response.ok){
            throw new Error("Server returned " + response.status + ". " + text.slice(0, 200));
        }

        let data;
        try{
            data = JSON.parse(text);
        }catch(_){
            throw new Error("The workflow did not return JSON. Check the Respond to Webhook node.");
        }

        // If the workflow returns an array, use the first item.
        if(Array.isArray(data)) data = data[0];

        // Property name must match exactly what Respond to Webhook returns (case-sensitive).
        const mapUrl = data && (data.mapurl || data.mapUrl);

        if(!mapUrl || !/^https?:\/\//i.test(mapUrl)){
            throw new Error("No valid map link in the response.");
        }

        result.innerHTML = "";
        const box = document.createElement("div");
        box.className = "success";
        box.append("✅ Map Generated");
        box.appendChild(document.createElement("br"));
        box.appendChild(document.createElement("br"));

        const link = document.createElement("a");
        link.href = mapUrl;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Open Map";
        box.appendChild(link);

        result.appendChild(box);
    }
    catch(err){
        showError(err.message);
    }
    finally{
        btn.disabled = false;
    }
});
</script>
</body>
</html>
